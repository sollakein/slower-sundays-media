name: Transcribe audio
on:
  push:
    paths: ["transcribe/list.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q openai-whisper
      - name: Word-level transcripts for each audio path in transcribe/list.txt
        run: |
          python - <<'PY'
          import json, pathlib, whisper
          m = whisper.load_model("small.en")
          for line in pathlib.Path("transcribe/list.txt").read_text().splitlines():
              p = line.strip()
              if not p or p.startswith("#") or not p.startswith("assets/"): continue
              r = m.transcribe(p, word_timestamps=True, language="en")
              words = [{"w": w["word"].strip(), "s": round(w["start"], 3), "e": round(w["end"], 3)} for s in r["segments"] for w in s["words"]]
              out = pathlib.Path(p).with_suffix(".words.json")
              out.write_text(json.dumps({"text": r["text"].strip(), "words": words}, indent=1))
              print("ok", out)
          PY
      - name: Commit
        run: |
          git config user.name "media-transcribe"
          git config user.email "hello@slowersundays.com"
          git add assets
          git diff --cached --quiet || git commit -m "Transcribe audio from transcribe/list.txt"
          git push
