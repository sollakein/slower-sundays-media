name: Fetch media
on:
  push:
    paths: ["fetch/list.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Download each file in fetch/list.txt (one "url<TAB>path" per line)
        run: |
          set -e
          while IFS=$'\t' read -r url path; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            case "$path" in assets/*) ;; *) echo "skip $path (outside assets/)"; continue;; esac
            mkdir -p "$(dirname "$path")"
            if curl -fsSL --retry 2 -A "SlowerSundaysMediaFetch/1.0 (hello@slowersundays.com)" -o "$path" "$url"; then
              echo "ok $path"
            else
              echo "FAIL $path"; rm -f "$path"
            fi
          done < fetch/list.txt
      - name: Commit
        run: |
          git config user.name "media-fetch"
          git config user.email "hello@slowersundays.com"
          git add assets
          git diff --cached --quiet || git commit -m "Fetch media from fetch/list.txt"
          for i in 1 2 3 4; do git pull --rebase -X ours -q && git push && break; sleep $((i*5)); done
